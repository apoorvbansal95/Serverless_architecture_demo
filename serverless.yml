service:youtube-api
frameworkVersion:"3"

provider:
  name:aws
  runtime:nodejs20.x
  region:ap-south-1

functions:
  awsDemoFn:
    handler:hello.handler
    events:
      - httpApi:
          path:/hello
          method:GET
  awsByeDemoFn:
    handler:bye.handler
    events:
      - httpApi:
          path:/bye
          method:GET